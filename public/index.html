<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Погодный дайджест — просмотр отчёта</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 16px;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 16px;
      }
      .status {
        opacity: 0.7;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 12px;
      }
      th,
      td {
        border: 1px solid #8884;
        padding: 6px 10px;
        text-align: left;
      }
      td.num,
      th.num {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>Погодный дайджест</h1>

    <label>
      Откройте JSON-отчёт из каталога reports/:
      <input id="file" type="file" accept=".json,application/json" />
    </label>

    <p id="status" class="status">Отчёт не загружен.</p>
    <div id="report"></div>

    <script>
      // Страница читает сохранённый утилитой JSON-отчёт и строит таблицу
      // средствами DOM API (createElement / append / textContent), без innerHTML и библиотек.
      const statusEl = document.querySelector('#status');
      const reportEl = document.querySelector('#report');

      document.querySelector('#file').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        try {
          const report = JSON.parse(await file.text());
          if (!report.place || !Array.isArray(report.days)) {
            throw new Error('в файле нет полей place и days');
          }
          renderReport(report);
          statusEl.textContent = `Загружен файл: ${file.name}`;
        } catch (error) {
          reportEl.replaceChildren();
          statusEl.textContent = `Не удалось прочитать отчёт: ${error.message}`;
        }
      });

      // Создаёт элемент с текстом; className — необязательный
      function el(tag, text, className) {
        const node = document.createElement(tag);
        node.textContent = text;
        if (className) node.className = className;
        return node;
      }

      function formatNumber(value) {
        return typeof value === 'number' ? value.toFixed(1) : '—';
      }

      function renderReport({ place, days, units = {} }) {
        const title = [place.name, place.region, place.country].filter(Boolean).join(', ');
        const coords = `${place.latitude.toFixed(4)}, ${place.longitude.toFixed(4)}`;
        const temperature = units.temperature || '°C';
        const precipitation = { mm: 'мм', inch: 'дюйм' }[units.precipitation] || 'мм';

        const table = document.createElement('table');
        const head = document.createElement('tr');
        head.append(
          el('th', 'Дата'),
          el('th', `t min, ${temperature}`, 'num'),
          el('th', `t max, ${temperature}`, 'num'),
          el('th', `Осадки, ${precipitation}`, 'num'),
        );
        table.append(head);

        for (const day of days) {
          const row = document.createElement('tr');
          row.append(
            el('td', day.date),
            el('td', formatNumber(day.tempMin), 'num'),
            el('td', formatNumber(day.tempMax), 'num'),
            el('td', formatNumber(day.precipitation), 'num'),
          );
          table.append(row);
        }

        reportEl.replaceChildren(el('h2', title), el('p', `Координаты: ${coords}`), table);
      }
    </script>
  </body>
</html>
